name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Prüfen (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Paketbau als Probe: lädt Node.js (mit Prüfsumme), baut das Archiv und startet auf dem Build-Rechner die Laufzeit.
      - name: Paket bauen (Windows)
        if: runner.os == 'Windows'
        run: node scripts/package.mjs --target win-x64 --skip-build

      - name: Paket bauen (Linux)
        if: runner.os == 'Linux'
        run: node scripts/package.mjs --target linux-x64 --skip-build

      # Echter Installationstest auf der frischen Ubuntu-VM des Runners (systemd, root): install.sh, Anmeldung, Update, uninstall.sh
      - name: Linux-Installation prüfen
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          tar -xzf release/craftmanager-*-linux-x64.tar.gz -C "$work"
          cd "$work"/craftmanager-*-linux-x64
          sudo ./install.sh --port 3917
          token="$(sudo sed -n "s/^AUTH_TOKEN='\(.*\)'$/\1/p" /etc/craftmanager/craftmanager.env)"
          test -n "$token"
          curl -fsS http://127.0.0.1:3917/api/health
          echo
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3917/api/servers)" = 401
          curl -fsS -H "Authorization: Bearer $token" http://127.0.0.1:3917/api/servers
          echo
          test "$(sudo stat -c '%a %U:%G' /etc/craftmanager/craftmanager.env)" = "640 root:craftmanager"
          sudo ./install.sh        # Update: Konfiguration und Token bleiben
          test "$(sudo sed -n "s/^AUTH_TOKEN='\(.*\)'$/\1/p" /etc/craftmanager/craftmanager.env)" = "$token"
          systemctl is-active craftmanager
          sudo ./uninstall.sh
          test -d /var/lib/craftmanager
          test ! -e /opt/craftmanager
          sudo ./uninstall.sh --purge --yes
          test ! -d /var/lib/craftmanager
